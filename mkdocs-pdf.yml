site_name: IHP pdk
docs_dir: docs
site_dir: build/pdf
nav:
  - Home: index.md
  - Reference:
      - Cells: cells.md
      - Changelog: changelog.md
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - admonition
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_toc_entry: false
            show_source: false
  - with-pdf:
      author: GDSFactory
      cover_subtitle: Photonics Process Design Kit
      output_path: ../../docs.pdf
theme:
  name: material
  logo: logo.png
