name: Test PEX rules with gfpex

on:
  workflow_dispatch:

jobs:
  test-pex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gfpex (private, needs GFPEX_TOKEN)
        run: |
          uv sync --all-extras
          uv pip install networkx "kfnetlist @ git+https://github.com/gdsfactory/kfnetlist" \
            "gfpex @ git+https://x-access-token:${{ secrets.GFPEX_TOKEN }}@github.com/doplaydo/gf-pex@dev/diogo-main"
      - name: Run PEX tests
        run: uv run --no-sync pytest tests/gfpex/ -v
